[project]
name = "cluster-grouper-backend"
version = "0.1.0"
description = "Local facial clustering and human review for Footage Review API v1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.17,<2",
  "httpx2>=2.16,<3",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.13,<5",
  "pillow>=13,<14",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
